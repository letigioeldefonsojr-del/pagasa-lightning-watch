name: Lightning watch

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  LIGHTNING_SOURCE: panahon
  MAX_RUNTIME_SECONDS: '21000'
  COMMIT_INTERVAL_SECONDS: '300'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
                run: pip install requests numpy Pillow "python-socketio[client]" websocket-client

      - name: Watch continuously, committing (and syncing to Drive) periodically
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python scripts/watch_and_commit.py
